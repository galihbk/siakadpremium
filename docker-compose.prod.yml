services:
  postgres:
    image: postgres:16-alpine
    container_name: siakad-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siakad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siakad_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-siakad_premium}
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siakad} -d ${POSTGRES_DB:-siakad_premium}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siakad-network

  redis:
    image: redis:7-alpine
    container_name: siakad-redis-prod
    restart: always
    command: redis-server --appendonly yes
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siakad-network

  api:
    image: ghcr.io/${IMAGE_OWNER:-galihbk}/siakad-api:latest
    pull_policy: always
    container_name: siakad-api-prod
    restart: always
    ports:
      - '${SIAKAD_API_PORT:-3101}:3001'
    env_file:
      - path: .env
        required: false
    volumes:
      - api_uploads:/app/uploads
      - api_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siakad-network

  web:
    image: ghcr.io/${IMAGE_OWNER:-galihbk}/siakad-web:latest
    pull_policy: always
    container_name: siakad-web-prod
    restart: always
    ports:
      - '${SIAKAD_WEB_PORT:-3100}:3000'
    environment:
      INTERNAL_API_URL: http://api:3001/api/v1
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    networks:
      - siakad-network

  pmb:
    image: ghcr.io/${IMAGE_OWNER:-galihbk}/siakad-pmb:latest
    pull_policy: always
    container_name: siakad-pmb-prod
    restart: always
    ports:
      - '${SIAKAD_PMB_PORT:-3103}:3004'
    environment:
      INTERNAL_API_URL: http://api:3001/api/v1
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    networks:
      - siakad-network

  p2m:
    image: ghcr.io/${IMAGE_OWNER:-galihbk}/siakad-p2m:latest
    pull_policy: always
    container_name: siakad-p2m-prod
    restart: always
    ports:
      - '${SIAKAD_P2M_PORT:-3104}:3005'
    environment:
      INTERNAL_API_URL: http://api:3001/api/v1
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    networks:
      - siakad-network

  p3m:
    image: ghcr.io/${IMAGE_OWNER:-galihbk}/siakad-p3m:latest
    pull_policy: always
    container_name: siakad-p3m-prod
    restart: always
    ports:
      - '${SIAKAD_P3M_PORT:-3105}:3006'
    environment:
      INTERNAL_API_URL: http://api:3001/api/v1
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    networks:
      - siakad-network

  portal:
    image: ghcr.io/${IMAGE_OWNER:-galihbk}/siakad-portal:latest
    pull_policy: always
    container_name: siakad-portal-prod
    restart: always
    ports:
      - '${SIAKAD_PORTAL_PORT:-3102}:3002'
    environment:
      INTERNAL_API_URL: http://api:3001/api/v1
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    networks:
      - siakad-network

volumes:
  postgres_data:
    name: siakad_postgres_prod_data
  redis_data:
    name: siakad_redis_prod_data
  api_uploads:
    name: siakad_api_prod_uploads
  api_backups:
    name: siakad_api_prod_backups

networks:
  siakad-network:
    name: siakad_prod_network
    driver: bridge
