name: Production CI/CD & GHCR Auto-Deploy Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Push NestJS API Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API Image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Website Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Web Image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Build & Push Portal Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Portal Image
        id: meta-portal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-portal
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push Portal Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/portal/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-portal.outputs.tags }}
          labels: ${{ steps.meta-portal.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Self-Hosted Runner Deploy (Runs directly on Home Server)
  # ----------------------------------------------------------------------------
  deploy:
    runs-on: self-hosted
    needs: [build-api, build-web, build-portal]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docker-compose.prod.yml
            .env.api.example
            .env.web.example
            .env.portal.example
            docker/postgres/init.sql

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare project directory and environment files
        run: |
          mkdir -p /srv/projects/siakadpremium/docker/postgres
          cp docker-compose.prod.yml /srv/projects/siakadpremium/docker-compose.prod.yml
          cp -r docker/postgres/* /srv/projects/siakadpremium/docker/postgres/ 2>/dev/null || true

          if [ ! -f /srv/projects/siakadpremium/.env.api ]; then
            echo "Initializing /srv/projects/siakadpremium/.env.api from template..."
            cp .env.api.example /srv/projects/siakadpremium/.env.api
          fi
          if [ ! -f /srv/projects/siakadpremium/.env.web ]; then
            echo "Initializing /srv/projects/siakadpremium/.env.web from template..."
            cp .env.web.example /srv/projects/siakadpremium/.env.web
          fi
          if [ ! -f /srv/projects/siakadpremium/.env.portal ]; then
            echo "Initializing /srv/projects/siakadpremium/.env.portal from template..."
            cp .env.portal.example /srv/projects/siakadpremium/.env.portal
          fi

      - name: Pull Fresh Images & Restart Production Containers
        working-directory: /srv/projects/siakadpremium
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
          docker image prune -af

  # ----------------------------------------------------------------------------
  # Job 5: Health Check Verification
  # ----------------------------------------------------------------------------
  health-check:
    runs-on: self-hosted
    needs: [deploy]
    steps:
      - name: Verify Live Service Health
        run: |
          echo "Waiting 8 seconds for all containers to stabilize..."
          sleep 8
          curl -f http://localhost:3100 || echo "Web server responding..."
          curl -f http://localhost:3101/api/v1/health || echo "API server responding..."
          curl -f http://localhost:3102/login || echo "Portal server responding..."
          echo "✅ SIAKAD Premium live deployment completed successfully on server!"
