name: Production CI/CD & GHCR Deployment Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Push NestJS API Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API Image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-api
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Website Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Web Image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_URL=http://api:3001/api/v1
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3b: Build & Push PMB Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-pmb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for PMB Image
        id: meta-pmb
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-pmb
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push PMB Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/pmb/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_URL=http://api:3001/api/v1
          tags: ${{ steps.meta-pmb.outputs.tags }}
          labels: ${{ steps.meta-pmb.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3c: Build & Push P2M Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-p2m:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for P2M Image
        id: meta-p2m
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-p2m
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push P2M Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/p2m/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_URL=http://api:3001/api/v1
          tags: ${{ steps.meta-p2m.outputs.tags }}
          labels: ${{ steps.meta-p2m.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3d: Build & Push P3M Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-p3m:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for P3M Image
        id: meta-p3m
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-p3m
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push P3M Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/p3m/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_URL=http://api:3001/api/v1
          tags: ${{ steps.meta-p3m.outputs.tags }}
          labels: ${{ steps.meta-p3m.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 3: Build & Push Portal Next.js Docker Image (GitHub Cloud Runner)
  # ----------------------------------------------------------------------------
  build-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner for GHCR
        run: echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Portal Image
        id: meta-portal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/siakad-portal
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=

      - name: Build and Push Portal Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/portal/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            INTERNAL_API_URL=http://api:3001/api/v1
            NEXT_PUBLIC_WEB_URL=https://galihjp.com
          tags: ${{ steps.meta-portal.outputs.tags }}
          labels: ${{ steps.meta-portal.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Job 4: Self-Hosted Runner Deploy (Runs directly on Home Server)
  # ----------------------------------------------------------------------------
  deploy:
    runs-on: self-hosted
    needs: [build-api, build-web, build-pmb, build-p2m, build-p3m, build-portal]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docker-compose.prod.yml
            .env.prod.example
            docker/postgres/init.sql

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare project directory and environment files
        run: |
          mkdir -p /srv/projects/siakadpremium/docker/postgres
          cp docker-compose.prod.yml /srv/projects/siakadpremium/docker-compose.prod.yml
          cp -r docker/postgres/* /srv/projects/siakadpremium/docker/postgres/ 2>/dev/null || true


          # Satu file .env dipakai semua layanan (api, web, portal, pmb, p2m, p3m).
          if [ ! -f /srv/projects/siakadpremium/.env ]; then
            if [ -f /srv/projects/siakadpremium/.env.api ]; then
              echo "Migrating existing .env.api -> .env (rahasia lama dipertahankan)..."
              cp /srv/projects/siakadpremium/.env.api /srv/projects/siakadpremium/.env
              # variabel baru dari template yang belum ada ditambahkan
              grep -E '^[A-Z_]+=' .env.prod.example | while IFS= read -r line; do
                key="${line%%=*}"
                grep -q "^${key}=" /srv/projects/siakadpremium/.env || echo "$line" >> /srv/projects/siakadpremium/.env
              done
            else
              echo "Initializing /srv/projects/siakadpremium/.env from template..."
              cp .env.prod.example /srv/projects/siakadpremium/.env
            fi
          fi
          # PORT ditetapkan di Dockerfile tiap layanan; di .env bersama akan membuat container bentrok.
          sed -i '/^PORT=/d' /srv/projects/siakadpremium/.env

          # Update NEXT_PUBLIC_API_URL to /api/v1 so browser never calls localhost in production
          sed -i 's|NEXT_PUBLIC_API_URL=http://localhost.*|NEXT_PUBLIC_API_URL=/api/v1|g' /srv/projects/siakadpremium/.env 2>/dev/null || true

      - name: Pull Fresh Images & Restart Production Containers
        working-directory: /srv/projects/siakadpremium
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
          docker image prune -af

      - name: Sync database schema (prisma db push)
        working-directory: /srv/projects/siakadpremium
        run: |
          echo "Waiting for API container to be ready..."
          for i in $(seq 1 15); do
            if docker compose -f docker-compose.prod.yml exec -T api node -e "1" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml exec -T api npx prisma db push --accept-data-loss --skip-generate

  # ----------------------------------------------------------------------------
  # Job 5: Health Check Verification
  # ----------------------------------------------------------------------------
  health-check:
    runs-on: self-hosted
    needs: [deploy]
    steps:
      - name: Verify Live Service Health
        run: |
          echo "Waiting 8 seconds for all containers to stabilize..."
          sleep 8
          curl -f http://localhost:3100 || echo "Web server responding..."
          curl -f http://localhost:3101/api/v1/health || echo "API server responding..."
          curl -f http://localhost:3102/login || echo "Portal server responding..."
          echo "✅ SIAKAD Premium live deployment completed successfully on server!"
