services:
  postgres:
    image: postgres:16-alpine
    container_name: siakad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-siakad_premium}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-siakad_premium}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - siakad-network

  redis:
    image: redis:7-alpine
    container_name: siakad-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - siakad-network

volumes:
  postgres_data:
    name: siakad_postgres_data
  redis_data:
    name: siakad_redis_data

networks:
  siakad-network:
    name: siakad_network
    driver: bridge
